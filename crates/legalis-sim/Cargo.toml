[package]
name = "legalis-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Simulation engine for Legalis-RS"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis-sim"

[dependencies]
legalis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true
chrono.workspace = true
indexmap.workspace = true
num_cpus.workspace = true
wide = "1.5"
rand.workspace = true
cudarc = { workspace = true, optional = true }

[features]
default = []
# Real NVIDIA CUDA acceleration for the GPU module. When enabled (and a CUDA
# device is present at runtime) condition evaluation runs as an NVRTC-compiled
# kernel on the GPU; otherwise the module transparently falls back to the CPU.
cuda = ["dep:cudarc"]

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "simulation"
harness = false
