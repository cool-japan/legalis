[package]
name = "legalis-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audit trail and decision logging for Legalis-RS"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis-audit"

[dependencies]
legalis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
oxisql-core.workspace = true
oxisql-sqlite-compat.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio.workspace = true
aes-gcm.workspace = true
base64.workspace = true
rand.workspace = true
fop-render.workspace = true
rust_xlsxwriter.workspace = true
oxiarc-deflate.workspace = true
num_cpus.workspace = true
hostname = "0.4"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile.workspace = true

[[bench]]
name = "audit_benchmarks"
harness = false
