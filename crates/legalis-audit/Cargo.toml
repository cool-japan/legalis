[package]
name = "legalis-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Audit trail and decision logging for Legalis-RS"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis-audit"

[dependencies]
legalis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
aes-gcm = "0.10"
base64.workspace = true
rand.workspace = true
fop-render.workspace = true
rust_xlsxwriter = "0.94"
oxiarc-deflate.workspace = true
num_cpus.workspace = true
hostname = "0.4"

[dev-dependencies]
criterion = { workspace = true, features = ["html_reports"] }
tempfile.workspace = true

[[bench]]
name = "audit_benchmarks"
harness = false
