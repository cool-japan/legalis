[package]
name = "legalis-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interoperability layer for legal DSL formats (Catala, Stipula, L4, Akoma Ntoso)"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis-interop"

[dependencies]
legalis-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
sha2.workspace = true
regex-lite.workspace = true
quick-xml.workspace = true
rayon = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
walkdir = { version = "2.5", optional = true }
notify = { version = "8.2", optional = true }
serde_yaml = { workspace = true, optional = true }

[features]
default = []
parallel = ["rayon"]
async = ["tokio"]
batch = ["walkdir", "notify", "serde_yaml", "rayon"]

[dev-dependencies]
criterion.workspace = true
tokio.workspace = true
tempfile.workspace = true

[[bench]]
name = "conversion"
harness = false
