[package]
name = "legalis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Legalis-RS"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis"

[[bin]]
name = "legalis"
path = "src/main.rs"

[dependencies]
legalis-core.workspace = true
legalis-dsl.workspace = true
legalis-verifier.workspace = true
legalis-viz.workspace = true
legalis-chain.workspace = true
legalis-api.workspace = true
legalis-diff.workspace = true
legalis-sim.workspace = true
legalis-audit.workspace = true
legalis-porting.workspace = true
legalis-i18n.workspace = true
legalis-interop.workspace = true
legalis-lod.workspace = true
legalis-registry.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete = "4.6"
clap_mangen = "0.3"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
dirs = "6.0"
colored = "3.1"
comfy-table = "7.2"
rustyline = "18.0"
indicatif = "0.18"
csv = "1.4"
rayon.workspace = true
glob = "0.3"
num_cpus.workspace = true
terminal_size = "0.4"
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
ratatui = "0.30"
crossterm = "0.29"
uuid.workspace = true
whoami = "2.1"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile.workspace = true
insta = { version = "1.47", features = ["yaml"] }
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "cli_benchmarks"
harness = false
