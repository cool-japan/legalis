[package]
name = "legalis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Legalis-RS"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/legalis"

[[bin]]
name = "legalis"
path = "src/main.rs"

[dependencies]
legalis-core.workspace = true
legalis-dsl.workspace = true
legalis-verifier.workspace = true
legalis-viz.workspace = true
legalis-chain.workspace = true
legalis-api.workspace = true
legalis-diff.workspace = true
legalis-sim.workspace = true
legalis-audit.workspace = true
legalis-porting.workspace = true
legalis-i18n.workspace = true
legalis-interop.workspace = true
legalis-lod.workspace = true
legalis-registry.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
dirs.workspace = true
colored.workspace = true
comfy-table.workspace = true
rustyline.workspace = true
indicatif.workspace = true
csv.workspace = true
rayon.workspace = true
glob.workspace = true
num_cpus.workspace = true
terminal_size.workspace = true
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize"] }
ratatui.workspace = true
crossterm.workspace = true
uuid.workspace = true
whoami.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
