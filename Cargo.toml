legalis-chain = { version = "0.1.7", path = "crates/legalis-chain" }
legalis-viz = { version = "0.1.7", path = "crates/legalis-viz" }
legalis-i18n = { version = "0.1.7", path = "crates/legalis-i18n" }
legalis-porting = { version = "0.1.7", path = "crates/legalis-porting" }
legalis-api = { version = "0.1.7", path = "crates/legalis-api" }
legalis = { version = "0.1.7", path = "crates/legalis-cli" }
legalis-audit = { version = "0.1.7", path = "crates/legalis-audit" }
legalis-registry = { version = "0.1.7", path = "crates/legalis-registry" }
legalis-diff = { version = "0.1.7", path = "crates/legalis-diff" }
legalis-interop = { version = "0.1.7", path = "crates/legalis-interop" }
legalis-lod = { version = "0.1.7", path = "crates/legalis-lod" }
