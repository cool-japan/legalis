[workspace]
resolver = "3"
members = [
    # Core Layer
    "crates/legalis-core",
    "crates/legalis-dsl",
    "crates/legalis-registry",
    # Intelligence Layer
    "crates/legalis-llm",
    "crates/legalis-verifier",
    # Simulation & Analysis Layer
    "crates/legalis-sim",
    "crates/legalis-diff",
    # Internationalization & Porting Layer
    "crates/legalis-i18n",
    "crates/legalis-porting",
    # Interoperability Layer
    "crates/legalis-interop",
    # Output Layer
    "crates/legalis-viz",
    "crates/legalis-chain",
    "crates/legalis-lod",
    # Infrastructure Layer
    "crates/legalis-audit",
    "crates/legalis-api",
    "crates/legalis-cli",
    # Jurisdictions
    "jurisdictions/jp",
    "jurisdictions/de",
    "jurisdictions/fr",
    "jurisdictions/us",
    "jurisdictions/eu",
    "jurisdictions/sg",
    "jurisdictions/uk",
    "jurisdictions/ca",
    "jurisdictions/au",
    "jurisdictions/la",
    "jurisdictions/cn",
    "jurisdictions/in",
    "jurisdictions/br",
    "jurisdictions/th",
    "jurisdictions/id",
    "jurisdictions/vn",
    "jurisdictions/ae",
    "jurisdictions/za",
    "jurisdictions/kr",
    "jurisdictions/my",
    "jurisdictions/ru",
    "jurisdictions/sa",
    "jurisdictions/mx",
    # Examples
    "examples/jp-constitution-3d",
    "examples/welfare-benefits",
    "examples/minpo-709-tort",
    "examples/minpo-709-builder",
    "examples/minpo-710-damages-builder",
    "examples/minpo-715-employer-liability",
    "examples/minpo-415-breach-damages",
    "examples/minpo-integrated-tort-damages",
    "examples/comparative-tort-law",
    "examples/jp-drone-regulation",
    # International Examples
    "examples/eu-gdpr-compliance",
    "examples/uk-employment-law",
    "examples/brazil-consumer-protection",
    "examples/india-rti-act",
    "examples/singapore-business",
    "examples/australia-immigration",
    "examples/canada-healthcare",
    "examples/korea-labor-law",
    "examples/mexico-tax-law",
    "examples/thailand-business",
    # Advanced/Research Examples
    "examples/soviet-law-history",
    "examples/private-international-law",
    "examples/laos-civil-code",
    "examples/religious-legal-systems",
    # Technical Feature Examples
    "examples/smart-contract-export",
    "examples/legal-knowledge-graph",
    "examples/statute-version-control",
    "examples/legal-dsl-interop",
    "examples/multilingual-statute",
    "examples/judgment-anonymization",
    "examples/llm-hallucination-firewall",
    "examples/legislative-diff-simulator",
    "examples/executable-law",
    "examples/gdpr-cross-border-validator",
    "examples/cross-jurisdiction-demo",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
documentation = "https://docs.rs/legalis"
homepage = "https://github.com/cool-japan/legalis"
repository = "https://github.com/cool-japan/legalis"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2.14", features = ["serde"] }
regex = "1.12"
rayon = "1.12"
rand = "0.10.1"
hex = "0.4"
tempfile = "3.27"
sha2 = "0.11"
lru = "0.18"
base64 = "0.22"
num_cpus = "1.17"
oxiarc-deflate = "0.3.3"
quick-xml = { version = "0.40", features = ["serialize"] }

# Pure-Rust SQLite-compatible storage (OxiSQL — COOLJAPAN, replaces rusqlite/libsqlite3-sys)
oxisql-core = "0.3.0"
oxisql-sqlite-compat = "0.3.0"

# HTTP/API
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "compression-deflate"] }
governor = "0.10"

# GraphQL
async-graphql = { version = "7.2.1", features = ["dataloader"] }
async-graphql-axum = "7.2.1"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Visualization
petgraph = "0.8"

# Testing
criterion = "0.8"
proptest = "1.11"

# PDF Export (fop-render — COOLJAPAN pure-Rust PDF backend)
fop-render = "0.1.2"

# Tracing/Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internationalization
rust-i18n = "4.1"
unic-langid = "0.9"

# SMT Solver (OxiZ - Pure Rust Z3 alternative)
# Using published crates.io version
oxiz-solver = "0.2.3"
oxiz-core = "0.2.3"
num-bigint = "0.4"

# GPU acceleration (NVIDIA CUDA driver + NVRTC runtime kernel compilation).
# Optional throughout the workspace; only legalis-sim's `cuda` feature pulls it in.
# `cuda-12000` matches the CUDA 12.x toolchain; `dynamic-loading` dlopen's libcuda/
# libnvrtc at runtime so crates still build on hosts without the CUDA toolkit.
cudarc = { version = "0.19", default-features = false, features = [
    "cuda-12000",
    "driver",
    "nvrtc",
    "std",
    "dynamic-loading",
] }

# Additional dependencies

# Monitoring / metrics
prometheus = "0.14"
lazy_static = "1.5"

# Async utilities
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
bytes = "1.11"

# URL parsing
url = "2.5"

# OpenTelemetry
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33"

# Caching / auth
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
oauth2 = "5.0"

# gRPC / Protobuf
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-reflection = "0.14"
tonic-health = "0.14"
tonic-web = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# Text matching / search
regex-lite = "0.1"
fuzzy-matcher = "0.3"

# Encryption
aes-gcm = "0.10"

# Office / spreadsheet
rust_xlsxwriter = "0.95"

# Logging
env_logger = "0.11"

# REPL / LSP
rustyline = "18"
tower-lsp = "0.20"

# Testing / snapshots
insta = { version = "1", features = ["json", "yaml"] }
tokio-test = "0.4"

# Numerics
ordered-float = "5.3"

# Hashing
md5 = "0.8"

# SIMD
wide = "1.5"

# CLI extras
clap_complete = "4.6"
clap_mangen = "0.3"
dirs = "6.0"
colored = "3.1"
comfy-table = "7.2"
indicatif = "0.18"
csv = "1.4"
glob = "0.3"
terminal_size = "0.4"

# TUI
ratatui = "0.30"
crossterm = "0.29"

# System info
whoami = "2.1"

# Integration testing
assert_cmd = "2.2"
predicates = "3.1"
once_cell = "1.21"

# Internal crates
legalis-core = { version = "0.1.7", path = "crates/legalis-core" }
legalis-dsl = { version = "0.1.7", path = "crates/legalis-dsl" }
legalis-llm = { version = "0.1.7", path = "crates/legalis-llm" }
legalis-sim = { version = "0.1.7", path = "crates/legalis-sim" }
